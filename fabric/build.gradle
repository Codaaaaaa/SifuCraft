sourceSets {
	// Standalone stand-in for the mod, used to validate the protocol against Sifu.
	stub {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	protocolTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	offlineTest {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xlint:all,-restricted,-serial,-processing']
}

tasks.register('runStub', JavaExec) {
	group = 'sifucraft'
	description = 'Runs the bridge stub (Minecraft endpoint stand-in). Pass --args="--duration 30".'
	classpath = sourceSets.stub.runtimeClasspath
	mainClass = 'dev.sifucraft.stub.BridgeStub'
	jvmArgs nativeAccess
}

tasks.register('protocolTest', JavaExec) {
	group = 'verification'
	description = 'Checks enemy table decoding against golden wire bytes and malformed input.'
	classpath = sourceSets.protocolTest.runtimeClasspath
	mainClass = 'dev.sifucraft.bridge.EnemyFrameTest'
}
tasks.named('check') { dependsOn tasks.named('protocolTest') }
tasks.register('worldProtocolTest', JavaExec) {
	group = 'verification'
	description = 'Checks the independent world color/depth/camera mailbox ABI.'
	classpath = sourceSets.protocolTest.runtimeClasspath
	mainClass = 'dev.sifucraft.bridge.WorldWriterTest'
}
tasks.named('check') { dependsOn tasks.named('worldProtocolTest') }

tasks.register('p7OfflineTest', JavaExec) {
	group = 'verification'
	description = 'Checks camera rays and save recovery without starting a game, window or server.'
	classpath = sourceSets.offlineTest.runtimeClasspath
	mainClass = 'dev.sifucraft.client.P7OfflineTest'
	jvmArgs nativeAccess
}
tasks.named('check') { dependsOn tasks.named('p7OfflineTest') }

tasks.register('p8OfflineTest', JavaExec) {
	group = 'verification'
	description = 'Checks installed block states, shapes and section revisions without starting a game.'
	classpath = sourceSets.offlineTest.runtimeClasspath
	mainClass = 'dev.sifucraft.blocks.P8OfflineTest'
	jvmArgs nativeAccess
}
tasks.named('check') { dependsOn tasks.named('p8OfflineTest') }

tasks.register('p9GeometryTest', JavaExec) {
	group = 'verification'
	classpath = sourceSets.offlineTest.runtimeClasspath
	mainClass = 'dev.sifucraft.blocks.P9GeometryTest'
	jvmArgs nativeAccess
}
tasks.named('check') { dependsOn tasks.named('p9GeometryTest') }

tasks.register('coverageFileTest', JavaExec) {
	group = 'verification'
	classpath = sourceSets.offlineTest.runtimeClasspath
	mainClass = 'dev.sifucraft.collision.CoverageFileTest'
	args rootProject.file('../protocol/fixtures/collision_coverage.hex').absolutePath
	jvmArgs nativeAccess
}
tasks.named('check') { dependsOn tasks.named('coverageFileTest') }

tasks.register('p10GeometryTest', JavaExec) {
	group = 'verification'
	classpath = sourceSets.offlineTest.runtimeClasspath
	mainClass = 'dev.sifucraft.combat.P10GeometryTest'
	jvmArgs nativeAccess
}
tasks.named('check') { dependsOn tasks.named('p10GeometryTest') }
tasks.register('shapeProtocolTest', JavaExec) {
	group = 'verification'
	classpath = sourceSets.protocolTest.runtimeClasspath
	mainClass = 'dev.sifucraft.bridge.ShapeWriterTest'
	jvmArgs nativeAccess
}
tasks.named('check') { dependsOn tasks.named('shapeProtocolTest') }
tasks.register('worldMotionProtocolTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.protocolTest.runtimeClasspath
    mainClass = 'dev.sifucraft.bridge.WorldMotionProtocolTest'
    jvmArgs nativeAccess
}
tasks.named('check') { dependsOn tasks.named('worldMotionProtocolTest') }
tasks.register('worldMotionRequestsTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.protocolTest.runtimeClasspath
    mainClass = 'dev.sifucraft.bridge.WorldMotionRequestsTest'
}
tasks.named('check') { dependsOn tasks.named('worldMotionRequestsTest') }

tasks.register('liveTestFocusTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.protocolTest.runtimeClasspath
    mainClass = 'dev.sifucraft.bridge.LiveTestFocusTest'
}

tasks.named('check') { dependsOn tasks.named('liveTestFocusTest') }
tasks.register('worldMotionInteropTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.protocolTest.runtimeClasspath
    mainClass = 'dev.sifucraft.bridge.WorldMotionInteropTest'
    args providers.gradleProperty('motionEcho').getOrElse('')
    jvmArgs nativeAccess
}
