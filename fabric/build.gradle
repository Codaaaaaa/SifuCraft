plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The bridge talks to Sifu through kernel32 via the Foreign Function & Memory API.
def nativeAccess = '--enable-native-access=ALL-UNNAMED'

loom {
	log4jConfigs.setFrom(file("config/log4j2.xml"))
	// main: bridge + common code; client: Minecraft client integration.
	splitEnvironmentSourceSets()

	mods {
		"sifucraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			vmArg nativeAccess
			// Development: enter the superflat test world directly and keep Sifu in the foreground.
			property "sifucraft.devWorld", "true"
			property "sifucraft.devWorldName", providers.gradleProperty("sifucraft.devWorldName").getOrElse("sifucraft-dev")
			property "sifucraft.inventorySelfTest", providers.gradleProperty("sifucraft.inventorySelfTest").getOrElse("false")
			property "sifucraft.devItems", providers.gradleProperty("sifucraft.devItems").getOrElse("false")
			property "sifucraft.devItemsSelfTest", providers.gradleProperty("sifucraft.devItemsSelfTest").getOrElse("false")
			property "sifucraft.totemSelfTest", providers.gradleProperty("sifucraft.totemSelfTest").getOrElse("false")
			property "sifucraft.foodSelfTest", providers.gradleProperty("sifucraft.foodSelfTest").getOrElse("false")
			property "sifucraft.maceSelfTest", providers.gradleProperty("sifucraft.maceSelfTest").getOrElse("false")
			property "sifucraft.windChargeSelfTest", providers.gradleProperty("sifucraft.windChargeSelfTest").getOrElse("false")
			property "sifucraft.survivalDifficultySelfTest", providers.gradleProperty("sifucraft.survivalDifficultySelfTest").getOrElse("false")
			property "sifucraft.elytraSelfTest", providers.gradleProperty("sifucraft.elytraSelfTest").getOrElse("false")
			property "sifucraft.nativeInteractionSelfTest", providers.gradleProperty("sifucraft.nativeInteractionSelfTest").getOrElse("false")
			property "sifucraft.worldEffects", providers.gradleProperty("sifucraft.worldEffects").getOrElse("false")
			property "sifucraft.worldEffectsSelfTest", providers.gradleProperty("sifucraft.worldEffectsSelfTest").getOrElse("false")
			property "sifucraft.worldLayers", providers.gradleProperty("sifucraft.worldLayers").getOrElse("false")
			property "sifucraft.worldParticleMatrix", providers.gradleProperty("sifucraft.worldParticleMatrix").getOrElse("false")
			property "sifucraft.worldTestVisibleHud", providers.gradleProperty("sifucraft.worldTestVisibleHud").getOrElse("false")
			property "sifucraft.worldProbe", providers.gradleProperty("sifucraft.worldProbe").getOrElse("false")
			property "sifucraft.worldCracksSelfTest", providers.gradleProperty("sifucraft.worldCracksSelfTest").getOrElse("false")
			property "sifucraft.worldCracksHoldMs", providers.gradleProperty("sifucraft.worldCracksHoldMs").getOrElse("400")
			property "sifucraft.worldModelSelfTest", providers.gradleProperty("sifucraft.worldModelSelfTest").getOrElse("false")
			property "sifucraft.worldModelHoldMs", providers.gradleProperty("sifucraft.worldModelHoldMs").getOrElse("500")
			property "sifucraft.worldAudioSelfTest", providers.gradleProperty("sifucraft.worldAudioSelfTest").getOrElse("false")
			property "sifucraft.avatarSelfTest", providers.gradleProperty("sifucraft.avatarSelfTest").getOrElse("false")
			property "sifucraft.avatarHoldMs", providers.gradleProperty("sifucraft.avatarHoldMs").getOrElse("650")
			property "sifucraft.worldStressSelfTest", providers.gradleProperty("sifucraft.worldStressSelfTest").getOrElse("false")
			property "sifucraft.blockStates", providers.gradleProperty("sifucraft.blockStates").getOrElse("true")
			property "sifucraft.blockShapes", providers.gradleProperty("sifucraft.blockShapes").getOrElse("true")
			property "sifucraft.blockModelSelfTest", providers.gradleProperty("sifucraft.blockModelSelfTest").getOrElse("false")
			property "sifucraft.fluidRenderSelfTest", providers.gradleProperty("sifucraft.fluidRenderSelfTest").getOrElse("false")
			property "sifucraft.pistonStressSelfTest", providers.gradleProperty("sifucraft.pistonStressSelfTest").getOrElse("false")
			property "sifucraft.sceneSupportSelfTest", providers.gradleProperty("sifucraft.sceneSupportSelfTest").getOrElse("false")
			property "sifucraft.redstoneSelfTest", providers.gradleProperty("sifucraft.redstoneSelfTest").getOrElse("false")
			property "sifucraft.signalSelfTest", providers.gradleProperty("sifucraft.signalSelfTest").getOrElse("false")
			property "sifucraft.signalNativeTest", providers.gradleProperty("sifucraft.signalNativeTest").getOrElse("false")
			property "sifucraft.playerSignalSelfTest", providers.gradleProperty("sifucraft.playerSignalSelfTest").getOrElse("false")
			property "sifucraft.sensorSelfTest", providers.gradleProperty("sifucraft.sensorSelfTest").getOrElse("false")
			property "sifucraft.pistonSceneSelfTest", providers.gradleProperty("sifucraft.pistonSceneSelfTest").getOrElse("false")
			property "sifucraft.worldFps", providers.gradleProperty("sifucraft.worldFps").getOrElse("30")
			property "sifucraft.shieldSelfTest", providers.gradleProperty("sifucraft.shieldSelfTest").getOrElse("false")
			property "sifucraft.shieldTestSupplies", providers.gradleProperty("sifucraft.shieldTestSupplies").getOrElse("false")
			property "sifucraft.hideWindow", providers.gradleProperty("sifucraft.hideWindow").getOrElse("true")
			property "sifucraft.overlay", providers.gradleProperty("sifucraft.overlay").getOrElse("false")
			property "sifucraft.overlayFps", providers.gradleProperty("sifucraft.overlayFps").getOrElse("60")
			property "sifucraft.exitWithSifu", "true"
			property "sifucraft.combatSelfTest", providers.gradleProperty("sifucraft.combatSelfTest").getOrElse("false")
			property "sifucraft.playerDamageTest", providers.gradleProperty("sifucraft.playerDamageTest").getOrElse("false")
			property "sifucraft.playerHitSelfTest", providers.gradleProperty("sifucraft.playerHitSelfTest").getOrElse("false")
			property "sifucraft.respawnSelfTest", providers.gradleProperty("sifucraft.respawnSelfTest").getOrElse("false")
		}
	}
}

sourceSets {
	// Standalone stand-in for the mod, used to validate the protocol against Sifu.
	stub {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	protocolTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	offlineTest {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xlint:all,-restricted,-serial,-processing']
}

tasks.register('runStub', JavaExec) {
	group = 'sifucraft'
	description = 'Runs the bridge stub (Minecraft endpoint stand-in). Pass --args="--duration 30".'
	classpath = sourceSets.stub.runtimeClasspath
	mainClass = 'dev.sifucraft.stub.BridgeStub'
	jvmArgs nativeAccess
}

tasks.register('protocolTest', JavaExec) {
	group = 'verification'
	description = 'Checks enemy table decoding against golden wire bytes and malformed input.'
	classpath = sourceSets.protocolTest.runtimeClasspath
	mainClass = 'dev.sifucraft.bridge.EnemyFrameTest'
}
tasks.named('check') { dependsOn tasks.named('protocolTest') }
tasks.register('worldProtocolTest', JavaExec) {
	group = 'verification'
	description = 'Checks the independent world color/depth/camera mailbox ABI.'
	classpath = sourceSets.protocolTest.runtimeClasspath
	mainClass = 'dev.sifucraft.bridge.WorldWriterTest'
}
tasks.named('check') { dependsOn tasks.named('worldProtocolTest') }

tasks.register('p7OfflineTest', JavaExec) {
	group = 'verification'
	description = 'Checks camera rays and save recovery without starting a game, window or server.'
	classpath = sourceSets.offlineTest.runtimeClasspath
	mainClass = 'dev.sifucraft.client.P7OfflineTest'
	jvmArgs nativeAccess
}
tasks.named('check') { dependsOn tasks.named('p7OfflineTest') }

tasks.register('p8OfflineTest', JavaExec) {
	group = 'verification'
	description = 'Checks installed block states, shapes and section revisions without starting a game.'
	classpath = sourceSets.offlineTest.runtimeClasspath
	mainClass = 'dev.sifucraft.blocks.P8OfflineTest'
	jvmArgs nativeAccess
}
tasks.named('check') { dependsOn tasks.named('p8OfflineTest') }
tasks.register('shapeProtocolTest', JavaExec) {
	group = 'verification'
	classpath = sourceSets.protocolTest.runtimeClasspath
	mainClass = 'dev.sifucraft.bridge.ShapeWriterTest'
	jvmArgs nativeAccess
}
tasks.named('check') { dependsOn tasks.named('shapeProtocolTest') }
tasks.register('worldMotionProtocolTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.protocolTest.runtimeClasspath
    mainClass = 'dev.sifucraft.bridge.WorldMotionProtocolTest'
    jvmArgs nativeAccess
}
tasks.named('check') { dependsOn tasks.named('worldMotionProtocolTest') }
tasks.register('worldMotionRequestsTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.protocolTest.runtimeClasspath
    mainClass = 'dev.sifucraft.bridge.WorldMotionRequestsTest'
}
tasks.named('check') { dependsOn tasks.named('worldMotionRequestsTest') }
tasks.register('worldMotionInteropTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.protocolTest.runtimeClasspath
    mainClass = 'dev.sifucraft.bridge.WorldMotionInteropTest'
    args providers.gradleProperty('motionEcho').getOrElse('')
    jvmArgs nativeAccess
}
