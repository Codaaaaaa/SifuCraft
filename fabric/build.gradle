plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The bridge talks to Sifu through kernel32 via the Foreign Function & Memory API.
def nativeAccess = '--enable-native-access=ALL-UNNAMED'

loom {
	log4jConfigs.setFrom(file("config/log4j2.xml"))
	// main: bridge + common code; client: Minecraft client integration.
	splitEnvironmentSourceSets()

	mods {
		"sifucraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			vmArg nativeAccess
			// Development: enter the superflat test world directly and keep Sifu in the foreground.
			property "sifucraft.devWorld", "true"
			property "sifucraft.devWorldName", providers.gradleProperty("sifucraft.devWorldName").getOrElse("sifucraft-dev")
			property "sifucraft.inventorySelfTest", providers.gradleProperty("sifucraft.inventorySelfTest").getOrElse("false")
			property "sifucraft.devItems", providers.gradleProperty("sifucraft.devItems").getOrElse("false")
			property "sifucraft.devItemsSelfTest", providers.gradleProperty("sifucraft.devItemsSelfTest").getOrElse("false")
			property "sifucraft.totemSelfTest", providers.gradleProperty("sifucraft.totemSelfTest").getOrElse("false")
			property "sifucraft.foodSelfTest", providers.gradleProperty("sifucraft.foodSelfTest").getOrElse("false")
			property "sifucraft.maceSelfTest", providers.gradleProperty("sifucraft.maceSelfTest").getOrElse("false")
			property "sifucraft.windChargeSelfTest", providers.gradleProperty("sifucraft.windChargeSelfTest").getOrElse("false")
			property "sifucraft.survivalDifficultySelfTest", providers.gradleProperty("sifucraft.survivalDifficultySelfTest").getOrElse("false")
			property "sifucraft.elytraSelfTest", providers.gradleProperty("sifucraft.elytraSelfTest").getOrElse("false")
			property "sifucraft.nativeInteractionSelfTest", providers.gradleProperty("sifucraft.nativeInteractionSelfTest").getOrElse("false")
